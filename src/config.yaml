site:
  name: turbomem
  site: 'https://blog.turbomem.dev'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: turbomem Blog
    template: '%s — turbomem'
  description: 'News, tutorials, and updates on turbomem — local-first agent memory for TypeScript. No Python. No servers.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: turbomem
    images:
      - url: '~/assets/images/og-default.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@arneesh'
    site: '@arneesh'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: '' # Blog list is the homepage at /
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-HGWJHC6PNR' # or "G-XXXXXXXXXX"

ui:
  theme: 'dark' # Matches turbomem.dev homepage default; toggle still works
